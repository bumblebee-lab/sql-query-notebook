        '<button class="btn btn-primary" id="btnSave">' + icon('save') + ' ' + (isEdit ? 'Save Changes' : 'Save Query') + '</button>',

      onOpen: function (box) {
        var ta = box.querySelector('#qSql');
        var gutter = box.querySelector('#qGutter');
        var stats = box.querySelector('#sqlStats');

        function syncGutter() {
          var lines = ta.value.split('\n').length;
          var out = '';
          for (var i = 1; i <= Math.max(lines, 1); i++) out += i + '\n';
          gutter.textContent = out;
          gutter.scrollTop = ta.scrollTop;
          stats.textContent = lines + ' line' + (lines === 1 ? '' : 's') + ' · ' +
            Fmt.num(ta.value.length) + ' characters · stored, never executed';
        }
        ta.addEventListener('input', syncGutter);
        ta.addEventListener('scroll', function () { gutter.scrollTop = ta.scrollTop; });

        // Tab inserts two spaces instead of leaving the field.
        ta.addEventListener('keydown', function (e) {
          if (e.key !== 'Tab' || e.shiftKey) return;
          e.preventDefault();
          var s = ta.selectionStart, en = ta.selectionEnd;
          ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
          ta.selectionStart = ta.selectionEnd = s + 2;
          syncGutter();
        });
        syncGutter();

        box.querySelector('#btnFormat').addEventListener('click', function () {
          ta.value = Sql.prettify(ta.value);
          syncGutter();
          Toast.info('Formatted.');
        });
        box.querySelector('#btnCopyEditor').addEventListener('click', function () {
          copyToClipboard(ta.value).then(function (ok) {
            ok ? Toast.ok('SQL query copied to clipboard') : Toast.err('Could not copy.');
          });
        });

        function collect() {
          return {
            queryId: isEdit ? q.queryId : '',
            name: box.querySelector('#qName').value,
            description: box.querySelector('#qDesc').value,
            categoryId: box.querySelector('#qCat').value,
            databaseId: box.querySelector('#qDb').value,
            status: box.querySelector('#qStatus').value,
            tags: box.querySelector('#qTags').value,
            sql: ta.value,
            changeSummary: isEdit ? box.querySelector('#qSummary').value : ''
          };
        }

        function validate(data) {
          var errs = [];
          ['qName', 'qCat', 'qDb', 'qSql'].forEach(function (id) {
            box.querySelector('#' + id).classList.remove('invalid');
          });
          if (!data.name.trim())      { errs.push('Query name is required.');  box.querySelector('#qName').classList.add('invalid'); }
          if (!data.categoryId)       { errs.push('Category is required.');    box.querySelector('#qCat').classList.add('invalid'); }
          if (!data.databaseId)       { errs.push('Database is required.');    box.querySelector('#qDb').classList.add('invalid'); }
          if (!data.sql.trim())       { errs.push('SQL code is required.');    box.querySelector('#qSql').classList.add('invalid'); }
          return errs;
        }

        function save(keepOpen) {
          var data = collect();
          var errs = validate(data);
          var errBox = box.querySelector('#formError');
          if (errs.length) {
            errBox.innerHTML = '<div class="alert error">' + icon('alert') + '<div>' + Fmt.esc(errs.join(' ')) + '</div></div>';
            return;
          }
          errBox.innerHTML = '';

          var saveBtn = box.querySelector('#btnSave');
          var newBtn = box.querySelector('#btnSaveNew');
          [saveBtn, newBtn].forEach(function (b) { if (b) b.disabled = true; });
          saveBtn.innerHTML = '<span class="spinner"></span> Saving…';

          API.call(isEdit ? 'updateQuery' : 'createQuery', data).then(function (res) {
            [saveBtn, newBtn].forEach(function (b) { if (b) b.disabled = false; });
            saveBtn.innerHTML = icon('save') + ' ' + (isEdit ? 'Save Changes' : 'Save Query');

            if (!res.success) {
              errBox.innerHTML = '<div class="alert error">' + icon('alert') + '<div>' + Fmt.esc(res.message) + '</div></div>';
              return;
            }
            Toast.ok(res.message);
            global.App.refreshLookups();

            if (keepOpen) {
              box.querySelector('#qName').value = '';
              box.querySelector('#qDesc').value = '';
              box.querySelector('#qTags').value = '';
              ta.value = '';
              syncGutter();
              box.querySelector('#qName').focus();
            } else {
              Modal.close();
              Views.reloadList();
              global.App.refreshCounts();
              if (res.data && res.data.queryId) Views.openQuery(res.data.queryId);
            }
          });
        }

        box.querySelector('#btnSave').addEventListener('click', function () { save(false); });
        var sn = box.querySelector('#btnSaveNew');
        if (sn) sn.addEventListener('click', function () { save(true); });

        // Ctrl/Cmd + Enter saves.
        box.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(false); }
        });
      }
    });
  }


  /* ==================================================================== *
   * Version history
   * ==================================================================== */
  Views.versionHistory = function (queryId) {
    Modal.open({
      size: 'lg',
      title: 'Version History',
      subtitle: queryId,
      body: '<div id="verBody">' + skeletonRows(4, 2) + '</div>',
      footer: '<button class="btn btn-secondary" data-modal-close>Close</button>'
    });

    API.call('getQueryVersions', { queryId: queryId }).then(function (res) {
      var body = document.getElementById('verBody');
      if (!body) return;
      if (!res.success) { body.innerHTML = errorState(res.message); return; }
      body.innerHTML = renderVersions(res.data);
      wireVersions(body, res.data);
    });
  };

  function renderVersions(d) {
    if (!d.versions.length) {
      return emptyState({ icon: 'history', title: 'No history yet', message: 'Versions appear here after the first edit.' });
    }
    return '<div class="flex between center mb-16 wrap gap-8">' +
        '<div><div class="bold">' + Fmt.esc(d.queryName) + '</div>' +
        '<div class="tiny muted">' + d.versions.length + ' version' + (d.versions.length === 1 ? '' : 's') +
        ' · currently v' + Fmt.esc(d.currentVersion) + '</div></div>' +
        (d.versions.length > 1
          ? '<button class="btn btn-sm btn-secondary" data-act="compare-latest">' + icon('compare') + ' Compare last two</button>'
          : '') +
      '</div>' +
      '<div class="timeline">' + d.versions.map(function (v) {
        return '<div class="tl-item' + (v.isCurrent ? ' current' : '') + '">' +
          '<div class="tl-head">' +
            '<span class="tl-version">V' + Fmt.esc(v.version) + '</span>' +
            (v.isCurrent ? '<span class="chip green">Current</span>' : '') +
            '<span class="tl-meta">' + Fmt.dateTime(v.changedAt) + ' · ' + Fmt.esc(v.changedBy) + '</span>' +
          '</div>' +
          '<div class="tl-summary">' + Fmt.esc(v.summary || 'No summary') + '</div>' +
          '<div class="tiny muted">' + v.lines + ' lines · ' + Fmt.num(v.chars) + ' characters</div>' +
          '<div class="tl-actions">' +
            '<button class="btn btn-sm btn-secondary" data-vview="' + Fmt.attr(v.versionId) + '">' + icon('eye') + ' View</button>' +
            '<button class="btn btn-sm btn-secondary" data-vcompare="' + Fmt.attr(v.versionId) + '" ' +
              'data-qid="' + Fmt.attr(v.queryId) + '">' + icon('compare') + ' Compare</button>' +
            (d.canRestore && !v.isCurrent
              ? '<button class="btn btn-sm btn-ghost" data-vrestore="' + Fmt.attr(v.versionId) + '" ' +
                'data-qid="' + Fmt.attr(v.queryId) + '" data-vnum="' + Fmt.attr(v.version) + '">' +
                icon('restore') + ' Restore</button>'
              : '') +
          '</div></div>';
      }).join('') + '</div>';
  }

  function wireVersions(body, d) {
    body.querySelectorAll('[data-vview]').forEach(function (b) {
      b.addEventListener('click', function () { Views.viewVersion(b.getAttribute('data-vview')); });
    });
    body.querySelectorAll('[data-vcompare]').forEach(function (b) {
      b.addEventListener('click', function () {
        Views.compareVersions(b.getAttribute('data-qid'), b.getAttribute('data-vcompare'), 'CURRENT');
      });
    });
    body.querySelectorAll('[data-vrestore]').forEach(function (b) {
      b.addEventListener('click', function () {
        var qid = b.getAttribute('data-qid'), vid = b.getAttribute('data-vrestore'), vnum = b.getAttribute('data-vnum');
        Modal.confirm({
          title: 'Restore version ' + vnum + '?',
          message: 'The current version is not destroyed. The restored SQL is saved as a new, higher version.',
          detail: 'Current v' + d.currentVersion + ' → restoring v' + vnum + ' creates a new version.',
          confirmLabel: 'Restore Version',
          onConfirm: function () {
            API.call('restoreVersion', { queryId: qid, versionId: vid }).then(function (res) {
              if (!res.success) { Toast.err(res.message); return; }
              Toast.ok(res.message);
              Views.reloadList();
              if (State.currentQueryId === qid) Views.openQuery(qid);
            });
          }
        });
      });
    });
    var cl = body.querySelector('[data-act="compare-latest"]');
    if (cl) cl.addEventListener('click', function () {
      Views.compareVersions(d.queryId, d.versions[1].versionId, 'CURRENT');
    });
  }

  Views.viewVersion = function (versionId) {
    API.call('getQueryVersion', { versionId: versionId }).then(function (res) {
      if (!res.success) { Toast.err(res.message); return; }
      var v = res.data;
      Modal.open({
        size: 'lg',
        title: 'Version ' + v.version,
        subtitle: v.queryId + ' · ' + Fmt.esc(v.changedBy) + ' · ' + Fmt.dateTime(v.changedAt),

  Views.compareVersions = function (queryId, leftId, rightId) {
    Modal.open({
      size: 'xl',
      title: 'Compare Versions',
      subtitle: queryId,
      body: '<div id="cmpBody">' + skeletonRows(6, 2) + '</div>',
      footer: '<button class="btn btn-secondary" data-modal-close>Close</button>'
    });

    API.call('compareQueryVersions', { queryId: queryId, leftId: leftId, rightId: rightId }).then(function (res) {
      var body = document.getElementById('cmpBody');
      if (!body) return;
      if (!res.success) { body.innerHTML = errorState(res.message); return; }

      var d = res.data;
      var adds = d.diff.filter(function (l) { return l.type === 'add'; }).length;
      var dels = d.diff.filter(function (l) { return l.type === 'del'; }).length;

      body.innerHTML =
        '<div class="flex between center wrap gap-8 mb-12">' +
          '<div class="small">' +
            '<span class="chip red">V' + Fmt.esc(d.left.version) + '</span> ' +

            ' &nbsp;→&nbsp; ' +
            '<span class="chip green">V' + Fmt.esc(d.right.version) + '</span> ' +
            '<span class="muted">' + Fmt.esc(d.right.changedBy) + ' · ' + Fmt.dateTime(d.right.changedAt) + '</span>' +
          '</div>' +
          '<div class="diff-legend">' +
            '<span style="color:var(--diff-add-bar)">+ ' + adds + ' added</span>' +
            '<span style="color:var(--diff-del-bar)">− ' + dels + ' removed</span>' +
          '</div>' +
        '</div>' +
        (adds + dels === 0
          ? '<div class="alert success">' + icon('checkCircle') + '<div>These two versions are identical.</div></div>'
          : '<div class="diff">' + d.diff.map(function (l) {
              var sign = l.type === 'add' ? '+' : (l.type === 'del' ? '−' : ' ');
              return '<div class="diff-line ' + l.type + '">' +
                '<span class="no">' + (l.leftNo || '') + '</span>' +
                '<span class="no">' + (l.rightNo || '') + '</span>' +
                '<span class="sign">' + sign + '</span>' +
                '<span class="txt">' + Sql.highlight(l.text) + '</span></div>';
            }).join('') + '</div>');
    });
  };

  var PERM_LABELS = {

  function renderMatrix(wrap, d) {
    var editable = d.editable;
    var granted = {};
    d.roles.forEach(function (r) {
      granted[r.roleId] = {};
      r.permissions.forEach(function (p) { granted[r.roleId][p] = true; });
    });

    wrap.innerHTML =
      '<div class="grid-3 mb-16">' + d.roles.map(function (r) {
        return '<section class="card"><div class="card-body">' +
          '<div class="flex between center mb-8">' +
            '<h3 style="font-size:14px">' + Fmt.esc(r.name) + '</h3>' +
            (r.isSystem ? '<span class="chip">Built in</span>'
              : (editable ? '<button class="row-btn" data-del-role="' + Fmt.attr(r.roleId) + '" ' +
                 'data-name="' + Fmt.attr(r.name) + '" aria-label="Delete role">' + icon('trash') + '</button>' : '')) +
          '</div>' +
          '<p class="small muted mb-8">' + Fmt.esc(r.description || '') + '</p>' +
          '<div class="flex gap-8 center">' +
            '<span class="chip primary">' + r.userCount + ' user' + (r.userCount === 1 ? '' : 's') + '</span>' +
            '<span class="chip">' + r.permissions.length + ' permissions</span>' +
          '</div></div></section>';
      }).join('') + '</div>' +

      '<section class="card"><div class="card-head">' +
        '<h2 class="card-title">Permission Matrix</h2>' +
        (editable ? '<button class="btn btn-sm btn-primary" id="savePerms" disabled>' + icon('save') + ' Save Changes</button>'
                  : '<span class="chip">Read only</span>') +
      '</div><div class="matrix-wrap"><table class="matrix"><thead><tr><th>Permission</th>' +
        d.roles.map(function (r) { return '<th>' + Fmt.esc(r.name) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
        d.permissions.map(function (p) {
          return '<tr><td>' + Fmt.esc(PERM_LABELS[p] || p) + '<span class="perm-key">' + Fmt.esc(p) + '</span></td>' +
            d.roles.map(function (r) {
              var isProtected = r.roleId === 'ROLE-ADMIN' && (p === 'MANAGE_ROLES' || p === 'MANAGE_USERS');
              return '<td><input type="checkbox" ' +
                'data-role="' + Fmt.attr(r.roleId) + '" data-perm="' + Fmt.attr(p) + '" ' +
                (granted[r.roleId][p] ? 'checked ' : '') +
                (editable && !isProtected ? '' : 'disabled ') +
                'aria-label="' + Fmt.attr(r.name + ': ' + (PERM_LABELS[p] || p)) + '"></td>';
            }).join('') + '</tr>';
        }).join('') +
      '</tbody></table></div></section>';

    if (!editable) return;

    var changes = {};
    var saveBtn = wrap.querySelector('#savePerms');

    wrap.querySelectorAll('.matrix input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var key = cb.getAttribute('data-role') + '::' + cb.getAttribute('data-perm');
        var original = !!granted[cb.getAttribute('data-role')][cb.getAttribute('data-perm')];
        if (cb.checked === original) delete changes[key];
        else changes[key] = { roleId: cb.getAttribute('data-role'), permission: cb.getAttribute('data-perm'), allowed: cb.checked };
        var n = Object.keys(changes).length;
        saveBtn.disabled = n === 0;
        saveBtn.innerHTML = icon('save') + ' Save Changes' + (n ? ' (' + n + ')' : '');
      });
    });

    saveBtn.addEventListener('click', function () {
      var list = Object.keys(changes).map(function (k) { return changes[k]; });
      if (!list.length) return;
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner"></span> Saving…';
      API.call('updatePermissions', { changes: list }).then(function (res) {
        if (!res.success) {
          Toast.err(res.message);
          saveBtn.disabled = false;
          saveBtn.innerHTML = icon('save') + ' Save Changes';
          return;
        }
        Toast.ok(res.message);
        changes = {};
        global.App.refreshUser();
        global.App.render();
      });
    });
  }

          App.onSessionLost('Your session has expired.');

          App._warned = true;

            left--;
            var n = box.querySelector('#sesSecs');

            if (left <= 0) { clearInterval(t); }

              if (res.success) {

            clearInterval(t);
            App.logout();
          });

    /* ------------------------------------------------------------ palette */
    openPalette: function (seed) {
      var back = document.getElementById('paletteBackdrop');
      var input = document.getElementById('paletteInput');
      if (!back) return;
      back.classList.add('open');
      input.value = seed || '';
      document.getElementById('paletteResults').innerHTML =
        '<div class="palette-empty">Start typing to search across names, tags, descriptions and SQL.</div>';
      setTimeout(function () { input.focus(); if (seed) App.runPalette(seed); }, 60);
    },

    closePalette: function () {
      var back = document.getElementById('paletteBackdrop');
      if (back) back.classList.remove('open');
    },

    runPalette: function (term) {
      var out = document.getElementById('paletteResults');
      if (!out) return;
      if (!term || term.length < 2) {
        out.innerHTML = '<div class="palette-empty">Type at least two characters.</div>';
        return;
      }
      API.call('searchQueries', { term: term, limit: 10 }).then(function (res) {
        if (!res.success) { out.innerHTML = '<div class="palette-empty">' + Fmt.esc(res.message) + '</div>'; return; }
        if (!res.data.length) {
          out.innerHTML = '<div class="palette-empty">No queries matched “' + Fmt.esc(term) + '”.</div>';
          return;
        }
        out.innerHTML = res.data.map(function (q, i) {
          return '<button class="palette-item' + (i === 0 ? ' active' : '') + '" data-open="' + Fmt.attr(q.queryId) + '">' +
            '<span class="pid">' + Fmt.esc(q.queryId) + '</span>' +
            '<span class="pname">' + Fmt.highlight(q.name, term) + '</span>' +
            '<span class="chip">' + Fmt.esc(q.category) + '</span></button>';
        }).join('');
      });
    },

    /* ------------------------------------------------------------ events */
    bindShell: function () {
      var $ = function (id) { return document.getElementById(id); };

      $('themeToggle').addEventListener('click', Theme.toggle);
      $('btnUser').addEventListener('click', App.userMenu);

      var notify = $('btnNotify');
      if (notify) notify.addEventListener('click', function () {
        App.go('activity');
        if (!State.can('VIEW_ACTIVITY_LOG')) Toast.info('Notifications arrive by email.');
      });

      var menuBtn = $('btnMenu'), sidebar = $('sidebar'), sBack = $('sidebarBackdrop');
      function closeSidebar() { sidebar.classList.remove('open'); sBack.classList.remove('open'); }
      if (menuBtn) menuBtn.addEventListener('click', function () {
        sidebar.classList.toggle('open');
        sBack.classList.toggle('open');
      });
      sBack.addEventListener('click', closeSidebar);

      // global search -> palette
      var gs = $('globalSearch');
      gs.addEventListener('focus', function () { App.openPalette(gs.value); gs.blur(); });

      var runPalette = debounce(function (v) { App.runPalette(v); }, 220);
      $('paletteInput').addEventListener('input', function () { runPalette(this.value); });
      $('paletteBackdrop').addEventListener('click', function (e) {
        if (e.target === this) App.closePalette();
      });

      $('mSearch').addEventListener('click', function () { App.openPalette(''); });
      $('mMore').addEventListener('click', App.moreSheet);

      $('drawerBackdrop').addEventListener('click', Drawer.close);
      $('modalBackdrop').addEventListener('click', function (e) {
        if (e.target === this) Modal.close();
      });

      document.querySelectorAll('.mnav-item[data-nav]').forEach(function (b) {
        b.addEventListener('click', function () { App.go(b.getAttribute('data-nav')); });
      });

      // ---- one delegated click handler for the whole application ----
      document.addEventListener('click', function (e) {
        var t = e.target.closest('[data-nav],[data-goto],[data-open],[data-copy],[data-fav],[data-edit],' +
          '[data-versions],[data-share],[data-duplicate],[data-delete],[data-restore],[data-purge],' +
          '[data-download],[data-page],[data-sort],[data-act],[data-tag],[data-unshare],[data-rmatt],' +
          '[data-cat-filter],[data-db-filter],[data-edit-cat],[data-del-cat],[data-edit-db],[data-del-db],' +
          '[data-edit-user],[data-deactivate],[data-reset-session],[data-reset-pw],[data-del-role],[data-logpage]');
        if (!t) return;

        var a = function (n) { return t.getAttribute(n); };

        if (a('data-nav'))  { App.go(a('data-nav')); closeSidebar(); return; }
        if (a('data-goto')) { App.go(a('data-goto')); return; }

        if (a('data-open'))      { App.closePalette(); Views.openQuery(a('data-open')); return; }
        if (a('data-copy'))      { App.copySql(a('data-copy')); return; }
        if (a('data-fav'))       { App.toggleFav(a('data-fav'), t); return; }
        if (a('data-edit'))      { Views.queryForm(a('data-edit')); return; }
        if (a('data-versions'))  { Views.versionHistory(a('data-versions')); return; }
        if (a('data-share'))     { Views.shareQuery(a('data-share')); return; }
        if (a('data-duplicate')) { App.duplicate(a('data-duplicate')); return; }
        if (a('data-delete'))    { App.deleteQuery(a('data-delete')); return; }
        if (a('data-restore'))   { App.restoreQuery(a('data-restore')); return; }
        if (a('data-purge'))     { App.purgeQuery(a('data-purge')); return; }
        if (a('data-download'))  { App.downloadSql(a('data-download')); return; }
        if (a('data-unshare'))   { App.removeShare(a('data-unshare')); return; }
        if (a('data-rmatt'))     { App.removeAttachment(a('data-rmatt')); return; }

        if (a('data-page'))    { Views.setPage(a('data-page')); return; }
        if (a('data-sort'))    { Views.setSort(a('data-sort')); return; }
        if (a('data-logpage')) { Views.setLogPage(a('data-logpage')); return; }

        // These survive the scope change via _pending (see Views.queryList).
        if (a('data-tag')) {
          Drawer.close();
          Views.listState.showFilters = true;
          Views.listState._pending = { tag: a('data-tag') };
          App.go('queries');
          return;
        }
        if (a('data-cat-filter')) {
          Views.listState._pending = { categoryId: a('data-cat-filter') };
          App.go('queries'); return;
        }
        if (a('data-db-filter')) {
          Views.listState._pending = { databaseId: a('data-db-filter') };
          App.go('queries'); return;
        }

        if (a('data-edit-cat')) { Views.categoryForm(a('data-edit-cat')); return; }
        if (a('data-del-cat'))  { App.deleteCategory(a('data-del-cat'), a('data-name'), a('data-count')); return; }
        if (a('data-edit-db'))  { Views.databaseForm(a('data-edit-db')); return; }
        if (a('data-del-db'))   { App.deleteDatabase(a('data-del-db'), a('data-name'), a('data-count')); return; }

        if (a('data-edit-user'))     { Views.userForm(a('data-edit-user')); return; }
        if (a('data-deactivate'))    { App.deactivateUser(a('data-deactivate'), a('data-name')); return; }
        if (a('data-reset-session')) { App.resetSession(a('data-reset-session'), a('data-name')); return; }
        if (a('data-reset-pw'))      { App.resetPassword(a('data-reset-pw'), a('data-name')); return; }
        if (a('data-del-role'))      { App.deleteRole(a('data-del-role'), a('data-name')); return; }

        switch (a('data-act')) {
          case 'new-query':      Views.queryForm(null); break;
          case 'new-category':   Views.categoryForm(null); break;
          case 'new-database':   Views.databaseForm(null); break;
          case 'new-user':       Views.userForm(null); break;
          case 'new-role':       Views.roleForm(); break;
          case 'view-sessions':  Views.activeSessions(); break;
          case 'export':         Views.exportDialog(); break;
          case 'apply-filters':  Views.applyAdvancedFilters(document.getElementById('content')); break;
          case 'reset-filters':  Views.resetFilters(document.getElementById('content')); break;
          case 'reset-log':      Views.resetLogFilters(); break;
          case 'save-filter':    App.saveFilter(); break;
          case 'reload':         App.render(); break;
          case 'pick-file':      App.pickFile(t.getAttribute('data-qid')); break;
        }
      });

      // page size select lives inside re-rendered markup
      document.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'pageSize') Views.setPageSize(e.target.value);
      });
    },

    bindGlobalKeys: function () {
      document.addEventListener('keydown', function (e) {
        // Ctrl/Cmd + K -> palette
        if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          if (State.user) App.openPalette('');
          return;
        }
        // "/" focuses search when not typing
        if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
          e.preventDefault();
          if (State.user) App.openPalette('');
          return;
        }
        if (e.key === 'Escape') {
          var back = document.getElementById('paletteBackdrop');
          if (back && back.classList.contains('open')) { App.closePalette(); return; }
          if (Modal.isOpen()) { Modal.close(); return; }
          if (Drawer.isOpen()) { Drawer.close(); return; }
        }
        // palette arrow navigation
        var pal = document.getElementById('paletteBackdrop');
        if (pal && pal.classList.contains('open') && ['ArrowDown', 'ArrowUp', 'Enter'].indexOf(e.key) !== -1) {
          var items = Array.prototype.slice.call(document.querySelectorAll('.palette-item'));
          if (!items.length) return;
          var idx = items.findIndex(function (n) { return n.classList.contains('active'); });
          if (e.key === 'Enter') { e.preventDefault(); items[Math.max(idx, 0)].click(); return; }
          e.preventDefault();
          items.forEach(function (n) { n.classList.remove('active'); });
          idx = (e.key === 'ArrowDown') ? Math.min(idx + 1, items.length - 1) : Math.max(idx - 1, 0);
          items[idx].classList.add('active');
          items[idx].scrollIntoView({ block: 'nearest' });
        }
      });
    },

        copyToClipboard(res.data.sql).then(function (ok) {
          if (!ok) { Toast.err('Could not access the clipboard. Open the query and copy manually.'); return; }

        if (!res.success) { Toast.err(res.message); return; }
        downloadText(res.data.filename, res.data.content, 'text/plain;charset=utf-8')
          ? Toast.ok('Downloaded ' + res.data.filename)

    pickFile: function (queryId) {
      var input = document.getElementById('attInput');
      if (!input) return;
      input.value = '';
      input.onchange = function () {
        var file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) { Toast.err('That file is larger than 10 MB.'); return; }

        var reader = new FileReader();
        reader.onload = function () {
          var b64 = String(reader.result).split(',')[1];
          Toast.info('Uploading ' + file.name + '…');
          API.call('uploadAttachment', {
            queryId: queryId, fileName: file.name, mimeType: file.type, base64: b64
          }).then(function (res) {
            if (!res.success) { Toast.err(res.message); return; }
            Toast.ok(res.message);
            Views.openQuery(queryId);
          });
        };
        reader.onerror = function () { Toast.err('The file could not be read.'); };
        reader.readAsDataURL(file);
      };
      input.click();
    },

    saveFilter: function () {
      var name = prompt('Name this filter:');
      if (!name) return;
      try {
        var all = JSON.parse(localStorage.getItem('sqn.filters') || '{}');
        all[name] = Views.currentFilters();
        localStorage.setItem('sqn.filters', JSON.stringify(all));
        Toast.ok('Filter "' + name + '" saved on this device.');
